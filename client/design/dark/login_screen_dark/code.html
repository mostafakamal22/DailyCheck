<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>WorkSync | Enterprise Login</title>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        theme: {
          extend: {
            "colors": {
                    "surface-bright": "#363940",
                    "surface-container": "#1c2026",
                    "secondary-container": "#39485a",
                    "on-tertiary-container": "#4f2d00",
                    "primary-container": "#47a1ff",
                    "on-primary-fixed": "#001c38",
                    "tertiary": "#ffb868",
                    "primary-fixed-dim": "#a2c9ff",
                    "inverse-primary": "#0060a9",
                    "on-secondary-fixed": "#0d1c2d",
                    "tertiary-fixed-dim": "#ffb868",
                    "primary-fixed": "#d3e4ff",
                    "on-surface-variant": "#c0c7d4",
                    "surface-container-highest": "#31353b",
                    "surface-tint": "#a2c9ff",
                    "secondary": "#b9c8de",
                    "background": "#101419",
                    "on-tertiary-fixed-variant": "#673d00",
                    "on-error-container": "#ffdad6",
                    "surface-dim": "#101419",
                    "on-tertiary": "#482900",
                    "on-primary": "#00315b",
                    "surface-container-low": "#181c22",
                    "on-surface": "#e0e2ea",
                    "on-secondary": "#233143",
                    "secondary-fixed-dim": "#b9c8de",
                    "error-container": "#93000a",
                    "surface-container-lowest": "#0b0e14",
                    "on-error": "#690005",
                    "secondary-fixed": "#d4e4fa",
                    "surface-container-high": "#262a30",
                    "tertiary-fixed": "#ffddbb",
                    "on-primary-fixed-variant": "#004881",
                    "primary": "#a2c9ff",
                    "tertiary-container": "#e08a00",
                    "on-tertiary-fixed": "#2b1700",
                    "outline": "#8a919d",
                    "on-primary-container": "#003663",
                    "inverse-on-surface": "#2d3137",
                    "outline-variant": "#404752",
                    "surface": "#101419",
                    "on-secondary-fixed-variant": "#39485a",
                    "error": "#ffb4ab",
                    "inverse-surface": "#e0e2ea",
                    "surface-variant": "#31353b",
                    "on-secondary-container": "#a7b6cc",
                    "on-background": "#e0e2ea"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-desktop": "64px",
                    "gutter": "16px",
                    "unit": "8px",
                    "container-padding-md": "24px",
                    "container-padding-sm": "16px",
                    "margin-mobile": "16px",
                    "xl": "32px",
                    "lg": "24px",
                    "md": "16px",
                    "sm": "8px",
                    "xs": "4px"
            },
            "fontFamily": {
                    "body-md": ["Inter"],
                    "title-md": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "headline-lg": ["Inter"],
                    "label-sm": ["Inter"],
                    "display-lg": ["Inter"],
                    "body-lg": ["Inter"],
                    "headline-md": ["Inter"]
            },
            "fontSize": {
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "title-md": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        input[type="checkbox"]:checked {
            background-color: #a2c9ff; /* primary */
            border-color: #a2c9ff;
        }
        .error-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col">
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile md:px-0 z-10 py-xl">
<!-- Login Container -->
<div class="w-full max-w-[440px] bg-surface-container-low rounded-xl shadow-[0_8px_32px_rgba(0,0,0,0.4)] border border-outline-variant/20 p-lg md:p-xl transition-all duration-300">
<!-- Brand Identity -->
<div class="flex flex-col items-center mb-xl">
<div class="w-14 h-14 bg-primary rounded-xl flex items-center justify-center mb-md shadow-lg">
<span class="material-symbols-outlined text-on-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">sync_alt</span>
</div>
<h1 class="text-primary font-headline-md text-headline-md tracking-tight">WorkSync</h1>
<p class="text-on-surface-variant font-body-md text-body-md mt-xs">Enterprise Attendance Portal</p>
</div>
<!-- Login Form -->
<form class="space-y-lg" id="loginForm" onsubmit="return handleLogin(event)">
<!-- Employee ID Field -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider block ml-1" for="employeeId">
                        Employee ID
                    </label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">badge</span>
<input class="w-full h-[52px] pl-12 pr-4 bg-surface-container-highest rounded-xl border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md outline-none text-on-surface placeholder:text-outline" id="employeeId" placeholder="Enter your ID" required="" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center px-1">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="password">
                            Password
                        </label>
<a class="text-primary font-label-sm text-label-sm hover:underline decoration-2 underline-offset-4" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full h-[52px] pl-12 pr-12 bg-surface-container-highest rounded-xl border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md outline-none text-on-surface placeholder:text-outline" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="passwordIcon">visibility</span>
</button>
</div>
</div>
<!-- Validation Hint (Hidden by default) -->
<div class="hidden flex items-start gap-2 p-md bg-error-container/20 border border-error/20 rounded-lg animate-in fade-in slide-in-from-top-1" id="errorMessage">
<span class="material-symbols-outlined text-error text-[20px]">error</span>
<p class="text-on-error-container font-body-md text-body-md">Invalid credentials. Please verify your Employee ID and try again.</p>
</div>
<!-- Remember Me -->
<div class="flex items-center justify-between py-xs">
<label class="flex items-center cursor-pointer group">
<input class="w-5 h-5 rounded border-outline-variant bg-surface-container-highest text-primary focus:ring-primary/40 transition-all" type="checkbox"/>
<span class="ml-3 font-body-md text-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">Remember Me</span>
</label>
</div>
<!-- Action Button -->
<button class="w-full h-12 bg-primary text-on-primary rounded-xl font-headline-md text-body-lg font-semibold shadow-lg hover:brightness-110 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2" type="submit">
                    Login
                    <span class="material-symbols-outlined">login</span>
</button>
</form>
<!-- SSO / Alternative Options -->
<div class="mt-xl pt-lg border-t border-outline-variant/20 text-center">
<p class="font-label-sm text-label-sm text-outline uppercase tracking-widest mb-md">Or Sign In With</p>
<div class="grid grid-cols-2 gap-md">
<button class="flex items-center justify-center h-12 border border-outline-variant rounded-xl bg-surface-container-high hover:bg-surface-container-highest transition-colors font-body-md font-semibold text-on-surface">
                        Microsoft
                    </button>
<button class="flex items-center justify-center h-12 border border-outline-variant rounded-xl bg-surface-container-high hover:bg-surface-container-highest transition-colors font-body-md font-semibold text-on-surface">
                        Okta
                    </button>
</div>
</div>
</div>
<!-- Support Link -->
<p class="mt-lg font-body-md text-body-md text-on-surface-variant">
            Need help? <a class="text-primary font-semibold hover:underline" href="#">Contact HR Support</a>
</p>
</main>
<!-- Footer Area (Decorative) -->
<footer class="py-lg px-margin-mobile text-center">
<p class="font-label-sm text-label-sm text-outline">
            © 2024 WorkSync Enterprise Solutions. All rights reserved.
        </p>
</footer>
<!-- Micro-interactions Script -->
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('passwordIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                icon.innerText = 'visibility';
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const errorDiv = document.getElementById('errorMessage');
            const formContainer = btn.closest('.bg-surface-container-low');
            
            // Loading State
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Authenticating...';
            btn.disabled = true;

            // Simulate Network delay
            setTimeout(() => {
                // Show error state for demonstration
                btn.innerHTML = originalContent;
                btn.disabled = false;
                errorDiv.classList.remove('hidden');
                formContainer.classList.add('error-shake');
                
                // Clear shake after animation
                setTimeout(() => {
                    formContainer.classList.remove('error-shake');
                }, 500);
            }, 1200);

            return false;
        }

        // Add focus effect for inputs
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                const icon = input.parentElement.querySelector('.material-symbols-outlined');
                if (icon) icon.style.color = '#a2c9ff'; // primary
            });
            input.addEventListener('blur', () => {
                const icon = input.parentElement.querySelector('.material-symbols-outlined');
                if (icon) icon.style.color = '#8a919d'; // outline
            });
        });
    </script>
</body></html>
