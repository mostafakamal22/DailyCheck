<body class="bg-background text-on-surface min-h-screen pb-margin-desktop">
<!-- Top Navigation Bar -->
<header class="fixed top-0 w-full z-50 glass-nav shadow-sm">
<div class="max-w-4xl mx-auto h-16 px-margin-mobile flex justify-between items-center">
<div class="flex items-center gap-sm">
<button aria-label="Back" class="p-base rounded-full hover:bg-surface-container-high/50 transition-colors flex items-center justify-center">

<h1 class="text-headline-md font-headline-md font-bold text-primary">Add New Employee</h1>
</div>
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-on-surface-variant">notifications</span>
<div class="w-8 h-8 rounded-full bg-secondary-container flex items-center justify-center">

</div>
</div>
</div>
</header>
<main class="mt-24 px-margin-mobile md:px-0 max-w-2xl mx-auto">
<form class="space-y-lg">
<!-- Profile Photo Section -->
<section class="flex flex-col items-center py-lg animate-in fade-in duration-700">
<div class="relative group cursor-pointer">
<div class="w-32 h-32 rounded-full bg-surface-container-highest border-2 border-dashed border-outline-variant flex flex-col items-center justify-center overflow-hidden transition-all group-hover:border-primary-container">
<img class="absolute inset-0 w-full h-full object-cover opacity-20 grayscale" data-alt="A clean, professional headshot placeholder for a corporate employee profile, featuring a generic silver-gray silhouette against a soft-focus office background with natural lighting. The style is modern, minimalist, and enterprise-focused, using high-key lighting to emphasize cleanliness and clarity in a light-mode UI." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDTWq1Gt33LLl4goAExKs3KVT_6MLpcAIrzy46BEeF_fwrrDwzTdpGi4qXUYtbKMsRXo3akhFPSG-GtRyqOprqLRuucAw-HvkmF0hkHXkLaROsUYgnN9rGhvALUyhJbpvx2jgE4h5JO4cBX4fEX6ae9xC-NwclpwL4l3l5fi28ZFEk3YVU7spFjIjPOLZXC3SVPj2R5XHQvyItXgT6sOZwLn8N4nKbKXel0KZc-u1bt6_-KVEryrNfk"/>
<span class="material-symbols-outlined text-on-surface-variant text-4xl mb-base">add_a_photo</span>
<span class="text-label-md font-label-md text-on-surface-variant">UPLOAD</span>
</div>
<button class="absolute bottom-1 right-1 bg-primary text-on-primary p-xs rounded-full shadow-lg border-2 border-surface-container-lowest flex items-center justify-center hover:scale-105 active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[18px]">edit</span>
</button>
</div>
<p class="mt-sm text-label-md font-label-md text-on-surface-variant">Max size 2MB (JPG, PNG)</p>
</section>
<!-- Personal Information Section -->
<section class="form-card rounded-xl p-lg">
<h2 class="text-headline-md font-headline-md text-primary mb-lg flex items-center gap-sm">
<span class="material-symbols-outlined">badge</span>
                    Personal Information
                </h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<!-- Full Name -->
<div class="flex flex-col gap-base">
<label class="text-label-md font-label-md text-on-surface-variant px-base">FULL NAME</label>
<input class="h-12 w-full rounded-lg border-outline-variant focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 text-body-md font-body-md px-md bg-surface-container-lowest transition-all" placeholder="John Doe" type="text"/>
</div>
<!-- Employee ID -->
<div class="flex flex-col gap-base">
<label class="text-label-md font-label-md text-on-surface-variant px-base">EMPLOYEE ID</label>
<input class="h-12 w-full rounded-lg border-outline-variant bg-surface-container-low text-on-surface-variant text-body-md font-body-md px-md cursor-not-allowed" readonly="" type="text" value="WS-48292"/>
</div>
<!-- Email Address -->
<div class="flex flex-col gap-base md:col-span-2">
<label class="text-label-md font-label-md text-on-surface-variant px-base">EMAIL ADDRESS</label>
<div class="relative">
<input class="h-12 w-full rounded-lg border-error focus:border-error focus:ring-2 focus:ring-error/20 text-body-md font-body-md px-md bg-surface-container-lowest transition-all" placeholder="john.doe@company.com" type="email"/>
<p class="mt-base text-label-md font-label-md text-error flex items-center gap-xs">
<span class="material-symbols-outlined text-[14px]">error</span>
                                Enter a valid email
                            </p>
</div>
</div>
<!-- Phone Number -->
<div class="flex flex-col gap-base md:col-span-2">
<label class="text-label-md font-label-md text-on-surface-variant px-base">PHONE NUMBER</label>
<input class="h-12 w-full rounded-lg border-outline-variant focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 text-body-md font-body-md px-md bg-surface-container-lowest transition-all" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
</section>
<!-- Employment Details Section -->
<section class="form-card rounded-xl p-lg">
<h2 class="text-headline-md font-headline-md text-primary mb-lg flex items-center gap-sm">
<span class="material-symbols-outlined">work</span>
                    Employment Details
                </h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<!-- Department -->
<div class="flex flex-col gap-base">
<label class="text-label-md font-label-md text-on-surface-variant px-base">DEPARTMENT</label>
<select class="h-12 w-full rounded-lg border-outline-variant focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 text-body-md font-body-md px-md bg-surface-container-lowest transition-all appearance-none">
<option value="">Select Department</option>
<option value="hr">HR</option>
<option value="engineering">Engineering</option>
<option value="operations">Operations</option>
<option value="marketing">Marketing</option>
</select>
</div>
<!-- Job Title -->

<label class="text-label-md font-label-md text-on-surface-variant px-base">JOB TITLE</label>
<input class="h-12 w-full rounded-lg border-outline-variant focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 text-body-md font-body-md px-md bg-surface-container-lowest transition-all" placeholder="e.g. Senior Developer" type="text"/>
</div>
<!-- Employment Type -->
<div class="flex flex-col gap-base md:col-span-2">
<label class="text-label-md font-label-md text-on-surface-variant px-base">EMPLOYMENT TYPE</label>
<div class="grid grid-cols-3 gap-md mt-base">
<label class="cursor-pointer group">
<input class="hidden peer" name="emp_type" type="radio"/>
<div class="h-14 flex items-center justify-center border-2 border-outline-variant rounded-xl text-label-md font-label-md peer-checked:border-primary-container peer-checked:bg-primary-container/5 peer-checked:text-primary transition-all group-hover:border-primary-container/50">
                                    FULL-TIME
                                </div>
</label>
<label class="cursor-pointer group">
<input class="hidden peer" name="emp_type" type="radio"/>
<div class="h-14 flex items-center justify-center border-2 border-outline-variant rounded-xl text-label-md font-label-md peer-checked:border-primary-container peer-checked:bg-primary-container/5 peer-checked:text-primary transition-all group-hover:border-primary-container/50">
                                    PART-TIME
                                </div>
</label>
<label class="cursor-pointer group">
<input class="hidden peer" name="emp_type" type="radio"/>
<div class="h-14 flex items-center justify-center border-2 border-outline-variant rounded-xl text-label-md font-label-md peer-checked:border-primary-container peer-checked:bg-primary-container/5 peer-checked:text-primary transition-all group-hover:border-primary-container/50">

<span class="text-label-md font-label-md">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">group</span>
<span class="text-label-md font-label-md">Staff</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">event_note</span>
<span class="text-label-md font-label-md">Logs</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">account_circle</span>
<span class="text-label-md font-label-md">Admin</span>
</div>
</nav>
<script>
        // Simple micro-interaction for input focusing
        document.querySelectorAll('input, select').forEach(element => {
            element.addEventListener('focus', () => {
                element.parentElement.querySelector('label')?.classList.add('text-primary');
            });
            element.addEventListener('blur', () => {
                element.parentElement.querySelector('label')?.classList.remove('text-primary');
            });
        });

        // Form submission prevention for demo
        document.querySelector('form').addEventListener('submit', (e) => {
            e.preventDefault();
            console.log('Form submission intercepted for demo.');
        });
    </script>
</body></html>
