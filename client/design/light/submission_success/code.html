<script>
        // Trigger Entrance Animations
        window.addEventListener('DOMContentLoaded', () => {
            const icon = document.getElementById('success-icon');
            const text = document.getElementById('success-text-group');
            const cards = document.getElementById('summary-cards');
            const btn = document.getElementById('button-group');

            setTimeout(() => {
                icon.classList.remove('scale-0');
                icon.classList.add('scale-100');
            }, 300);

            setTimeout(() => {
                text.classList.remove('opacity-0', 'translate-y-4');
                text.classList.add('opacity-100', 'translate-y-0');
            }, 600);

            setTimeout(() => {
                cards.classList.remove('opacity-0', 'translate-y-4');
                cards.classList.add('opacity-100', 'translate-y-0');
            }, 800);

            setTimeout(() => {
                btn.classList.remove('opacity-0', 'translate-y-4');
                btn.classList.add('opacity-100', 'translate-y-0');
                startConfetti();
            }, 1000);
        });

        // Simple Confetti Effect
        function startConfetti() {
            const canvas = document.getElementById('confetti');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const pieces = [];
            const numberOfPieces = 40;
            const colors = ['#003d9b', '#22c55e', '#d4e0f8'];

            for (let i = 0; i < numberOfPieces; i++) {
                pieces.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    rotation: Math.random() * 360,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speed: Math.random() * 2 + 1,
                    drift: Math.random() * 2 - 1
                });
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                pieces.forEach(p => {
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation * Math.PI / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();

                    p.y += p.speed;
                    p.x += p.drift;
                    p.rotation += 2;

                    if (p.y > canvas.height) {
                        p.y = -20;
                        p.x = Math.random() * canvas.width;
                    }
                });
                requestAnimationFrame(draw);
            }
            draw();
        }

        // Handle resize
        window.addEventListener('resize', () => {
            const canvas = document.getElementById('confetti');
            if(canvas) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
        });
    </script>
