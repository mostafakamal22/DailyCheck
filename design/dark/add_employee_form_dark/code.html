<body class="bg-background text-on-surface min-h-screen pb-margin-desktop">
<!-- Top Navigation Bar -->
<header class="fixed top-0 w-full z-50 glass-nav border-b border-outline-variant/30">
<div class="max-w-4xl mx-auto h-16 px-margin-mobile flex justify-between items-center">
<div class="flex items-center gap-2">
<button aria-label="Back" class="p-2 rounded-full hover:bg-surface-container-highest transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="text-title-md font-bold text-primary">Add New Employee</h1>
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant">notifications</span>
<div class="w-8 h-8 rounded-full bg-secondary-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-secondary-container text-[18px]">person</span>
</div>
</div>
</div>
</header>
<main class="mt-24 px-margin-mobile md:px-0 max-w-2xl mx-auto">
<form class="space-y-6">
<!-- Profile Photo Section -->
<section class="flex flex-col items-center py-6 animate-in fade-in duration-700">
<div class="relative group cursor-pointer">
<div class="w-32 h-32 rounded-full bg-surface-container-highest border-2 border-dashed border-outline flex flex-col items-center justify-center overflow-hidden transition-all group-hover:border-primary">
<img class="absolute inset-0 w-full h-full object-cover opacity-30 grayscale" data-alt="A clean, professional headshot placeholder for a corporate employee profile" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDTWq1Gt33LLl4goAExKs3KVT_6MLpcAIrzy46BEeF_fwrrDwzTdpGi4qXUYtbKMsRXo3akhFPSG-GtRyqOprqLRuucAw-HvkmF0hkHXkLaROsUYgnN9rGhvALUyhJbpvx2jgE4h5JO4cBX4fEX6ae9xC-NwclpwL4l3l5fi28ZFEk3YVU7spFjIjPOLZXC3SVPj2R5XHQvyItXgT6sOZwLn8N4nKbKXel0KZc-u1bt6_-KVEryrNfk"/>
<span class="material-symbols-outlined text-on-surface-variant text-4xl mb-1">add_a_photo</span>
<span class="text-label-sm font-semibold text-on-surface-variant">UPLOAD</span>
</div>
<button class="absolute bottom-1 right-1 bg-primary text-on-primary p-1.5 rounded-full shadow-lg border-2 border-surface-container-lowest flex items-center justify-center hover:scale-105 active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[18px]">edit</span>
</button>
</div>
<p class="mt-2 text-label-sm text-on-surface-variant">Max size 2MB (JPG, PNG)</p>
</section>
<!-- Personal Information Section -->
<section class="form-card rounded-xl p-6">
<h2 class="text-title-md text-primary mb-6 flex items-center gap-2">
<span class="material-symbols-outlined">badge</span>
                    Personal Information
                </h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Full Name -->
<div class="flex flex-col gap-1.5">
<label class="text-label-sm text-on-surface-variant px-1">FULL NAME</label>
<input class="h-12 w-full rounded-lg border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 text-body-md px-4 bg-surface-container-lowest text-on-surface placeholder-on-surface-variant/50 transition-all" placeholder="John Doe" type="text"/>
</div>
<!-- Employee ID -->
<div class="flex flex-col gap-1.5">
<label class="text-label-sm text-on-surface-variant px-1">EMPLOYEE ID</label>
<input class="h-12 w-full rounded-lg border-outline-variant bg-surface-container-low text-on-surface-variant text-body-md px-4 cursor-not-allowed" readonly="" type="text" value="WS-48292"/>
</div>
<!-- Email Address -->
<div class="flex flex-col gap-1.5 md:col-span-2">
<label class="text-label-sm text-on-surface-variant px-1">EMAIL ADDRESS</label>
<div class="relative">
<input class="h-12 w-full rounded-lg border-error focus:border-error focus:ring-2 focus:ring-error/20 text-body-md px-4 bg-surface-container-lowest text-on-surface placeholder-on-surface-variant/50 transition-all" placeholder="john.doe@company.com" type="email"/>
<p class="mt-1.5 text-label-sm text-error flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">error</span>
                                Enter a valid email
                            </p>
</div>
</div>
<!-- Phone Number -->
<div class="flex flex-col gap-1.5 md:col-span-2">
<label class="text-label-sm text-on-surface-variant px-1">PHONE NUMBER</label>
<input class="h-12 w-full rounded-lg border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 text-body-md px-4 bg-surface-container-lowest text-on-surface placeholder-on-surface-variant/50 transition-all" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
</section>
<!-- Employment Details Section -->
<section class="form-card rounded-xl p-6">
<h2 class="text-title-md text-primary mb-6 flex items-center gap-2">
<span class="material-symbols-outlined">work</span>
                    Employment Details
                </h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Department -->
<div class="flex flex-col gap-1.5">
<label class="text-label-sm text-on-surface-variant px-1">DEPARTMENT</label>
<select class="h-12 w-full rounded-lg border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 text-body-md px-4 bg-surface-container-lowest text-on-surface transition-all appearance-none">
<option value="">Select Department</option>
<option value="hr">HR</option>
<option value="engineering">Engineering</option>
<option value="operations">Operations</option>
<option value="marketing">Marketing</option>
</select>
</div>
<!-- Job Title -->
<div class="flex flex-col gap-1.5">
<label class="text-label-sm text-on-surface-variant px-1">JOB TITLE</label>
<input class="h-12 w-full rounded-lg border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 text-body-md px-4 bg-surface-container-lowest text-on-surface placeholder-on-surface-variant/50 transition-all" placeholder="e.g. Senior Developer" type="text"/>
</div>
<!-- Employment Type -->
<div class="flex flex-col gap-1.5 md:col-span-2">
<label class="text-label-sm text-on-surface-variant px-1">EMPLOYMENT TYPE</label>
<div class="grid grid-cols-3 gap-4 mt-1">
<label class="cursor-pointer group">
<input class="hidden peer" name="emp_type" type="radio"/>
<div class="h-14 flex items-center justify-center border-2 border-outline-variant rounded-xl text-label-sm font-bold peer-checked:border-primary peer-checked:bg-primary/10 peer-checked:text-primary text-on-surface-variant transition-all group-hover:border-primary/50">
                                    FULL-TIME
                                </div>
</label>
<label class="cursor-pointer group">
<input class="hidden peer" name="emp_type" type="radio"/>
<div class="h-14 flex items-center justify-center border-2 border-outline-variant rounded-xl text-label-sm font-bold peer-checked:border-primary peer-checked:bg-primary/10 peer-checked:text-primary text-on-surface-variant transition-all group-hover:border-primary/50">
                                    PART-TIME
                                </div>
</label>
<label class="cursor-pointer group">
<input class="hidden peer" name="emp_type" type="radio"/>
<div class="h-14 flex items-center justify-center border-2 border-outline-variant rounded-xl text-label-sm font-bold peer-checked:border-primary peer-checked:bg-primary/10 peer-checked:text-primary text-on-surface-variant transition-all group-hover:border-primary/50">
                                    CONTRACT
                                </div>
</label>
</div>
</div>
</div>
</section>

<footer class="flex flex-col md:flex-row gap-4 pt-6">
<button class="flex-1 h-14 bg-primary text-on-primary rounded-xl text-body-lg font-bold shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
<span class="material-symbols-outlined">person_add</span>
                    Create Employee
                </button>
<button class="h-14 px-8 bg-surface-container-high text-on-surface rounded-xl text-body-lg font-semibold hover:bg-surface-variant transition-all" type="button">
                    Cancel
                </button>
</footer>
</form>
</main>
<!-- Bottom Navigation (Mobile Only Shell) -->
<nav class="md:hidden fixed bottom-0 left-0 right-0 h-20 bg-surface/90 backdrop-blur-xl border-t border-outline-variant/30 flex justify-around items-center px-4 pb-safe z-50">
<div class="flex flex-col items-center justify-center text-primary font-semibold bg-primary/10 rounded-xl px-3 py-1 scale-[0.95]">
<span class="material-symbols-outlined">dashboard</span>
<span class="text-label-sm">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">group</span>
<span class="text-label-sm">Staff</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">event_note</span>
<span class="text-label-sm">Logs</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">account_circle</span>
<span class="text-label-sm">Admin</span>
</div>
</nav>
<script>
        // Simple micro-interaction for input focusing
        document.querySelectorAll('input, select').forEach(element => {
            element.addEventListener('focus', () => {
                element.parentElement.querySelector('label')?.classList.add('text-primary');
            });
            element.addEventListener('blur', () => {
                element.parentElement.querySelector('label')?.classList.remove('text-primary');
            });
        });

        // Form submission prevention for demo
        document.querySelector('form').addEventListener('submit', (e) => {
            e.preventDefault();
            console.log('Form submission intercepted for demo.');
        });
</script>
</body></html>
